name: Continuous Delivery Pipeline For Custom Model

on:
  push:
    branches:
      - main
    paths:
      - 'app/custom/**'
  workflow_dispatch:

jobs:
  ci-cd:
    name: Continuous Delivery for Custom Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Switch to main branch
        run: |
          git checkout main
          git pull origin main
        if: success()

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: success()

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: success()

      - name: Azure Login
        shell: bash
        run: |
          echo '${{ secrets.AZURE_CREDENTIALS }}' > azure-credentials.json
          export AZURE_CLIENT_ID=$(jq -r '.clientId' azure-credentials.json)
          export AZURE_CLIENT_SECRET=$(jq -r '.clientSecret' azure-credentials.json)
          export AZURE_TENANT_ID=$(jq -r '.tenantId' azure-credentials.json)
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -p "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --only-show-errors > /dev/null
          echo "✅ Login success"
        continue-on-error: false
        working-directory: ./app/custom
        if: success()

      - name: Fetch and Remap Secrets from Azure Key Vault
        run: |
          touch .env
          for secret_id in $(az keyvault secret list --vault-name "${{ secrets.VAULT_NAME }}" --query "[].id" -o tsv); do
            secret_name=$(basename "$secret_id")
            secret_value=$(az keyvault secret show --id "$secret_id" --query value -o tsv)
            env_name=$(echo "$secret_name" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
            echo "${env_name}='${secret_value}'" >> .env
          done
        working-directory: ./app/custom
        if: success()

      - name: Build and Push Docker Image To DockerHub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CUSTOM_DOCKER_IMAGE_NAME }}:${{ secrets.CUSTOM_DOCKER_IMAGE_TAG }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CUSTOM_DOCKER_IMAGE_NAME }}:${{ secrets.CUSTOM_DOCKER_IMAGE_TAG }}
        working-directory: ./app/custom
        if: success()

      - name: Install SSH Client and Pass
        run: sudo apt-get update && sudo apt-get install -y openssh-client sshpass
        if: success()

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.CUSTOM_FLASK_SERVER_IP }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        if: success()

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.CUSTOM_FLASK_SERVER_IP }}
          port: ${{ secrets.CUSTOM_FLASK_SERVER_PORT }}
          username: ${{ secrets.CUSTOM_FLASK_USERNAME }}
          key: ${{ secrets.CUSTOM_FLASK_PRIVATE_SSH_KEY }}
          script: |
            cd ~/${{ secrets.PWD }}
            docker compose down
            docker images -q ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CUSTOM_DOCKER_IMAGE_NAME }} | xargs -r docker rmi -f;
            docker compose up -d
        if: success()
